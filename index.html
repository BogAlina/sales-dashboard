<!-- ===== ОСНОВНАЯ СЕТКА ===== -->
<section class="charts-tables-grid">
  <!-- ГРАФИК -->
  <div class="chart-container">
    <h2>Динамика продаж по месяцам</h2>
    <div style="position: relative; height: 300px; width: 100%;">
      <canvas id="salesChart"></canvas>
    </div>
  </div>

  <!-- ТАБЛИЦА С ФИЛЬТРАМИ -->
  <div class="table-container">
    <div class="table-header">
      <h2>Данные по менеджерам</h2>
      <div class="filter-wrapper">
        <!-- Фильтр по регионам -->
        <div class="filter-group">
          <label for="regionFilter">Регион:</label>
          <select id="regionFilter">
            <option value="all">Все регионы</option>
            <option value="Москва">Москва</option>
            <option value="СПб">Санкт-Петербург</option>
            <option value="Казань">Казань</option>
            <option value="Новосибирск">Новосибирск</option>
            <option value="Екатеринбург">Екатеринбург</option>
            <option value="Краснодар">Краснодар</option>
            <option value="Красноярск">Красноярск</option>
          </select>
        </div>
        
        <!-- НОВЫЙ ФИЛЬТР ПО ОКРУГАМ -->
        <div class="filter-group">
          <label for="districtFilter">Округ:</label>
          <select id="districtFilter">
            <option value="all">Все округа</option>
            <option value="Центральный">Центральный</option>
            <option value="Северо-Западный">Северо-Западный</option>
            <option value="Приволжский">Приволжский</option>
            <option value="Сибирский">Сибирский</option>
            <option value="Уральский">Уральский</option>
            <option value="Южный">Южный</option>
          </select>
        </div>
  </select>
  </div>
  <button id="resetFilters" class="reset-btn">Сбросить</button>
  <button id="exportCSV" class="export-btn">📥 Скачать CSV</button>
</div>
        <!-- Кнопка сброса фильтров -->
        <button id="resetFilters" class="reset-btn">Сбросить</button>
      </div>
    </div>
    <div class="table-scroll">
      <table id="managerTable">
        <thead>
          <tr>
            <th>Менеджер</th>
            <th>Регион</th>
            <th>Округ</th>
            <th>Продажи (шт.)</th>
            <th>Выручка (₽)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Строки будут вставлены из JS -->
        </tbody>
      </table>
    </div>
  </div>
</section>
